# Builds README.md into index.html and publishes the whole repository as a
# GitHub Pages site, so that the page can link to the tape images, listings
# and pictures next to it.
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cmark-gfm
        run: sudo apt-get update && sudo apt-get install -y cmark-gfm
      - name: Build the page
        run: make
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
